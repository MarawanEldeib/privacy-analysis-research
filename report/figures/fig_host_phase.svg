<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
    <marker id="arwT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2E5A6E"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
  </defs>
  <text x="60" y="52" font-size="28" font-weight="700" fill="#222222">Host phase</text>
  <text x="60" y="80" font-size="17" fill="#666666">Windows 11 laptop</text>

  <rect x="45" y="100" width="700" height="330" rx="18" fill="#F7FAFB" stroke="#9BB3BD" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="66" y="128" font-size="15" fill="#5B7079" font-style="italic">Windows 11 laptop</text>

  <!-- app stack -->
  <g filter="url(#sh)"><rect x="80" y="150" width="300" height="250" rx="14" fill="#FDECEC" stroke="#B23A48" stroke-width="2"/></g>
  <text x="100" y="182" font-size="18" font-weight="700" fill="#7C1F2E">Applications</text>
  <g font-size="15.5" fill="#7C1F2E">
    <rect x="100" y="200" width="260" height="34" rx="7" fill="#FFFFFF" stroke="#E0AEB4"/><text x="116" y="222">Microsoft Word (augloop)</text>
    <rect x="100" y="244" width="260" height="34" rx="7" fill="#FFFFFF" stroke="#E0AEB4"/><text x="116" y="266">DeepL desktop</text>
    <rect x="100" y="288" width="260" height="34" rx="7" fill="#FFFFFF" stroke="#E0AEB4"/><text x="116" y="310">Edge / Copilot</text>
    <rect x="100" y="332" width="260" height="34" rx="7" fill="#FFFFFF" stroke="#E0AEB4"/><text x="116" y="354">Grammarly desktop</text>
  </g>

  <!-- system proxy -->
  <g filter="url(#sh)"><rect x="430" y="205" width="280" height="140" rx="14" fill="#E4EEF2" stroke="#2E5A6E" stroke-width="2.4"/></g>
  <g transform="translate(470,262)" stroke="#2E5A6E" stroke-width="2.4" fill="none"><circle cx="0" cy="0" r="13" fill="#FFFFFF"/><path d="M0,-19 v6 M0,13 v6 M-19,0 h6 M13,0 h6" stroke-width="3"/></g>
  <text x="502" y="252" font-size="17" font-weight="700" fill="#204551">System proxy</text>
  <text x="502" y="277" font-size="14.5" fill="#204551">WinINET + WinHTTP</text>
  <text x="502" y="298" font-size="14.5" fill="#204551">&#8594; 127.0.0.1:8080</text>

  <!-- mitmproxy (outside) -->
  <g filter="url(#sh)"><rect x="790" y="150" width="250" height="130" rx="14" fill="#E4EEF2" stroke="#2E5A6E" stroke-width="2.4"/></g>
  <g transform="translate(832,215)" stroke="#2E5A6E" stroke-width="2.6" fill="none"><path d="M0,-20 L18,-13 V2 C18,12 9,20 0,24 C-9,20 -18,12 -18,2 V-13 Z" fill="#FFFFFF"/><path d="M-7,2 L-2,8 L9,-5" stroke-width="3"/></g>
  <text x="868" y="208" font-size="17" font-weight="700" fill="#204551">mitmproxy</text>
  <text x="868" y="232" font-size="14.5" fill="#204551">(same add-on)</text>

  <!-- vendor -->
  <g filter="url(#sh)"><rect x="790" y="315" width="250" height="150" rx="14" fill="#FDECEC" stroke="#B23A48" stroke-width="2"/></g>
  <text x="812" y="348" font-size="16.5" font-weight="700" fill="#7C1F2E">Vendor servers</text>
  <g font-size="13.5" fill="#7C1F2E"><text x="812" y="374">augloop.svc.cloud.microsoft</text><text x="812" y="396">capi.grammarly.com</text><text x="812" y="418">www2.deepl.com</text><text x="812" y="440">copilot.microsoft.com</text></g>

  <!-- arrows -->
  <line x1="380" y1="275" x2="422" y2="275" stroke="#333333" stroke-width="2.4" marker-end="url(#arw)"/>
  <line x1="710" y1="260" x2="782" y2="230" stroke="#2E5A6E" stroke-width="2.4" marker-end="url(#arwT)"/>
  <line x1="915" y1="280" x2="915" y2="308" stroke="#2E5A6E" stroke-width="2.4" marker-end="url(#arwT)"/>

  <!-- callout -->
  <g filter="url(#sh)"><rect x="80" y="470" width="960" height="120" rx="14" fill="#EEF1F1" stroke="#4C6663" stroke-width="1.8"/></g>
  <text x="105" y="510" font-size="16.5" font-weight="700" fill="#2B3735">WinHTTP is the key</text>
  <text x="105" y="538" font-size="15" fill="#2B3735">native apps (Office, Grammarly desktop) bypass a browser-only (WinINET) proxy. Every flow is</text>
  <text x="105" y="560" font-size="15" fill="#2B3735">attributed to its destination host, so a leak is credited to the tool responsible, not to whatever else runs.</text>
</svg>
