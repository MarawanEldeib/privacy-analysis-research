<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
    <marker id="arwT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2E5A6E"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/></filter>
  </defs>
  <text x="60" y="52" font-size="28" font-weight="700" fill="#222222">Browser phase</text>
  <text x="60" y="80" font-size="17" fill="#666666">isolated Kali Linux VM</text>

  <!-- VM container -->
  <rect x="45" y="100" width="960" height="300" rx="18" fill="#F7FAFB" stroke="#9BB3BD" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="66" y="128" font-size="15" fill="#5B7079" font-style="italic">Kali Linux VM</text>

  <!-- local page -->
  <g filter="url(#sh)"><rect x="80" y="150" width="270" height="150" rx="14" fill="#FBF4E8" stroke="#C9A227" stroke-width="2"/></g>
  <g stroke="#8A6D1E" stroke-width="2.4" fill="none"><rect x="104" y="186" width="30" height="34" rx="2" fill="#FFFFFF"/><line x1="110" y1="196" x2="128" y2="196"/><line x1="110" y1="204" x2="128" y2="204"/><line x1="110" y1="212" x2="122" y2="212"/></g>
  <text x="150" y="196" font-size="18" font-weight="700" fill="#5C4A12">Local page</text>
  <text x="150" y="222" font-size="14.5" fill="#5C4A12">http://localhost</text>
  <text x="150" y="244" font-size="14.5" fill="#5C4A12">single text field,</text>
  <text x="150" y="264" font-size="14.5" fill="#5C4A12">canary memo</text>

  <!-- firefox -->
  <g filter="url(#sh)"><rect x="400" y="150" width="290" height="150" rx="14" fill="#FDECEC" stroke="#B23A48" stroke-width="2"/></g>
  <g stroke="#8E2434" stroke-width="2.4" fill="none"><circle cx="438" cy="205" r="16" fill="#FFFFFF"/><path d="M438 191 a14 14 0 1 1 -10 5" stroke-width="3"/></g>
  <text x="470" y="196" font-size="18" font-weight="700" fill="#7C1F2E">Firefox profile</text>
  <text x="470" y="222" font-size="14.5" fill="#7C1F2E">Grammarly / LanguageTool</text>
  <text x="470" y="244" font-size="14.5" fill="#7C1F2E">(or no-extension</text>
  <text x="470" y="264" font-size="14.5" fill="#7C1F2E">baseline)</text>

  <!-- proxy -->
  <g filter="url(#sh)"><rect x="740" y="150" width="230" height="150" rx="14" fill="#E4EEF2" stroke="#2E5A6E" stroke-width="2.4"/></g>
  <g transform="translate(792,210)" stroke="#2E5A6E" stroke-width="2.6" fill="none"><path d="M0,-22 L20,-14 V2 C20,14 10,22 0,26 C-10,22 -20,14 -20,2 V-14 Z" fill="#FFFFFF"/><path d="M-8,2 L-2,9 L10,-6" stroke-width="3"/></g>
  <text x="830" y="205" font-size="18" font-weight="700" fill="#204551">mitmproxy</text>
  <text x="830" y="230" font-size="14.5" fill="#204551">127.0.0.1:8080</text>

  <!-- vendor (outside VM) -->
  <g filter="url(#sh)"><rect x="1055" y="150" width="290" height="150" rx="14" fill="#FDECEC" stroke="#B23A48" stroke-width="2"/></g>
  <g transform="translate(1090,196)" stroke="#8E2434" stroke-width="2.4" fill="none"><path d="M-12 8 a12 8 0 0 1 3 -15 a10 9 0 0 1 19 2 a9 8 0 0 1 2 13 z" fill="#FFFFFF"/></g>
  <text x="1130" y="196" font-size="18" font-weight="700" fill="#7C1F2E">Vendor servers</text>
  <text x="1075" y="230" font-size="14.5" fill="#7C1F2E">capi.grammarly.com,</text>
  <text x="1075" y="252" font-size="14.5" fill="#7C1F2E">api.languagetool.org</text>

  <!-- arrows -->
  <line x1="350" y1="225" x2="392" y2="225" stroke="#333333" stroke-width="2.4" marker-end="url(#arw)"/>
  <text x="371" y="215" font-size="13" fill="#333" text-anchor="middle" font-style="italic">paste</text>
  <line x1="690" y1="225" x2="732" y2="225" stroke="#333333" stroke-width="2.4" marker-end="url(#arw)"/>
  <line x1="970" y1="225" x2="1047" y2="225" stroke="#2E5A6E" stroke-width="2.4" marker-end="url(#arwT)"/>
  <text x="1008" y="215" font-size="13" fill="#2E5A6E" text-anchor="middle" font-style="italic">HTTPS/WS</text>

  <!-- note -->
  <g filter="url(#sh)"><rect x="80" y="440" width="890" height="120" rx="14" fill="#EEF1F1" stroke="#4C6663" stroke-width="1.8"/></g>
  <text x="105" y="480" font-size="16.5" font-weight="700" fill="#2B3735">Manual paste fires the DOM input event</text>
  <text x="105" y="508" font-size="15" fill="#2B3735">so the extension reads the field and transmits. Positive control: example.com</text>
  <text x="105" y="530" font-size="15" fill="#2B3735">loads through the proxy each run, confirming interception is live (guards against a false zero).</text>
</svg>
